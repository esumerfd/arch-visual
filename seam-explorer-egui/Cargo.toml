[package]
name = "seam-explorer-egui"
version = "0.1.0"
edition = "2021"

[lib]
name = "seam_explorer_egui"
path = "src/lib.rs"

[[bin]]
name = "seam-explorer-egui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
egui_graphs = "0.31"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
seam-core = { path = "../seam-core" }

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["snapshot", "wgpu"] }
