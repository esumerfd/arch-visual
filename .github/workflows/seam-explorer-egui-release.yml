name: Release (egui)

# Intentional release workflow: publishes native macOS builds of the egui
# app only when a version tag is pushed — not on every push/PR. This is the
# EGUI app's own release lane, sitting beside seam-explorer-webview-release.yml
# (the Tauri app's own lane) and build-and-test.yml (the whole workspace's
# fast regression lane, which fires on every push/PR including tag pushes).
#
# The artifact is a zip, never a bare .app bundle directory. A macOS
# application bundle IS a directory; GitHub Release assets must be files.
# The sibling seam-explorer-webview-release.yml uploads a bundle-directory
# glob today — an inherited defect this lane deliberately does not repeat
# (and does not fix there either; that is a different app's problem).
# cargo-bundle 0.11.0 also has no dmg producer, so a zip is the only
# shippable shape here anyway, and it is exactly what a Homebrew Cask
# expects for a bare .app.
#
# Two architectures, each built on its OWN NATIVE runner rather than
# cross-compiled: macos-latest is Apple Silicon (arm64), macos-15-intel is
# Intel (x86_64). A single-runner build on macos-latest alone would ship an
# arm64-only binary that cannot execute on an Intel Mac — installs cleanly,
# then silently refuses to launch, with no error mentioning architecture.
#
# A `prepare` job on ubuntu-latest creates the GitHub Release once, up
# front, so the two build-matrix legs never race to create the same
# release — they only ever upload into an already-existing one.

on:
  push:
    tags:
      - "seam-explorer-egui-v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build:
    needs: prepare
    strategy:
      # fail-fast: false so one arch failing does not cancel the other and
      # leave the release half-populated with no record of why.
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.11.0 --locked

      - name: Derive and verify version
        # Fails the job when the tag-derived version and
        # seam-explorer-egui/Cargo.toml's version disagree — the single
        # defence against a release whose asset filename, tag, and shipped
        # CFBundleShortVersionString would otherwise silently diverge.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#seam-explorer-egui-v}"
          CRATE_VERSION=$(grep -m1 '^version' seam-explorer-egui/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$VERSION" != "$CRATE_VERSION" ]; then
            echo "Tag version ($VERSION) does not match seam-explorer-egui/Cargo.toml version ($CRATE_VERSION)" >&2
            exit 1
          fi
          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"

      - name: Bundle
        # Must run with seam-explorer-egui as the working directory:
        # cargo-bundle 0.11.0 globs [package.metadata.bundle].icon paths
        # against the process CWD, not the package root, and silently
        # produces an icon-less .app on a miss (no error, exit 0).
        working-directory: seam-explorer-egui
        run: cargo bundle --release --format osx --target ${{ matrix.target }}

      - name: Assert icon survived
        # cargo-bundle exits 0 even when it silently drops the icon on a
        # CWD miss, so this assertion is the only thing standing between a
        # working-directory mistake and a shipped icon-less app.
        run: |
          BUNDLE="seam-explorer-egui/target/${{ matrix.target }}/release/bundle/osx/Seam Explorer (egui).app"
          if [ ! -f "$BUNDLE/Contents/Resources/icon.icns" ]; then
            echo "icon.icns missing from bundle at $BUNDLE — cargo-bundle CWD glob likely missed" >&2
            exit 1
          fi

      - name: Package
        # Run from the bundle's parent directory so the archive contains
        # the .app at its root. The filename is a contract with 05-26's
        # Homebrew Cask: seam-explorer-egui-v${VERSION}-${TARGET}.zip,
        # where TARGET is the Rust target triple (not a shortened arm64/x64
        # form), matching the Cask's `arch arm:/intel:` interpolation.
        #
        # A .zip.sha256 sidecar is written next to the zip and uploaded
        # alongside it. The bundle is not reproducible — cargo-bundle
        # stamps CFBundleVersion with a build timestamp, so no local build
        # can ever reproduce CI's digest — so the sidecar is how 05-26's
        # Cask gets a real checksum: read the value CI already published,
        # rather than trying to compute it some other way.
        run: |
          TARGET="${{ matrix.target }}"
          ASSET="seam-explorer-egui-v${VERSION}-${TARGET}.zip"
          SHA_ASSET="seam-explorer-egui-v${VERSION}-${TARGET}.zip.sha256"
          cd "seam-explorer-egui/target/${TARGET}/release/bundle/osx"
          ditto -c -k --sequesterRsrc --keepParent "Seam Explorer (egui).app" "$ASSET"
          shasum -a 256 "$ASSET" > "$SHA_ASSET"
          {
            echo "ASSET_DIR=seam-explorer-egui/target/${TARGET}/release/bundle/osx"
            echo "ASSET_NAME=$ASSET"
            echo "SHA_ASSET_NAME=$SHA_ASSET"
          } >> "$GITHUB_ENV"

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "$ASSET_DIR/$ASSET_NAME" "$ASSET_DIR/$SHA_ASSET_NAME" --clobber
