name: Release (webview)

# Intentional release workflow: publishes a macOS installer only when a
# version tag is pushed — not on every push/PR. The build is unsigned
# (documented install friction for teammates). Narrowed to a single
# macOS-only build 2026-08-07 — other target platforms dropped from scope.
#
# Lives at this repo's own root. arch-visual is a standalone repo (remote
# esumerfd/arch-visual.git) — it is no longer nested inside the
# esumerfd/work monorepo, so no wk-arch-visual/ path prefix is needed
# anymore. The Tauri app lives at apps/seam-explorer-webview/ (its own
# original historical name pre-Phase-4-flattening, restored 2026-08-28
# from the interim, now-retired seam-explorer directory), and bundle
# output lands in the shared
# workspace target/ at repo root (seam-explorer-webview is a member of
# the root Cargo.toml workspace, alongside seam-core and
# seam-explorer-egui). This is the WEB app's own release lane, sitting
# beside a future seam-explorer-egui release workflow.
#
# A prepare -> build -> bump job chain mirrors seam-explorer-egui-release.yml's
# pattern: `prepare` resolves the release tag/version (a pushed tag or a
# workflow_dispatch override) and pushes the tag, `build` builds and uploads
# the installer at that exact resolved tag, and `bump` advances main to the
# next minor version once the release succeeds. Unlike egui's two-arch
# matrix, this app has a single build leg with no race risk, so no separate
# release-creation job is needed -- the existing "Upload installers to
# GitHub Release" step already safely creates and uploads the release in
# one shot.

on:
  push:
    tags:
      - "seam-explorer-webview-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.2.0. Defaults to the version in apps/seam-explorer-webview/Cargo.toml."
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag name
        id: tag
        env:
          REQUESTED: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            # Tag push: the tag is already the decision.
            TAG="${GITHUB_REF#refs/tags/}"
            echo "name=$TAG"                              >> "$GITHUB_OUTPUT"
            echo "version=${TAG#seam-explorer-webview-v}"  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${REQUESTED:-$(./scripts/version.sh get apps/seam-explorer-webview)}"
          tag="seam-explorer-webview-v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists — pass a different version input"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A custom version has to land on the branch before it is tagged,
          # so the tagged tree and the release agree on what was built.
          ./scripts/version.sh set "$version" apps/seam-explorer-webview
          if ! git diff --quiet -- apps/seam-explorer-webview/Cargo.toml Cargo.lock apps/seam-explorer-webview/tauri.conf.json apps/seam-explorer-webview/package.json; then
            git add apps/seam-explorer-webview/Cargo.toml Cargo.lock apps/seam-explorer-webview/tauri.conf.json apps/seam-explorer-webview/package.json
            git commit -m "chore(webview): set release version to ${version}"
            git push origin "HEAD:${BRANCH}"
          fi

          git tag "$tag"
          git push origin "$tag"
          echo "name=$tag"        >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tauri.conf.json matches resolved version
        # This app has no pre-existing version-verify step to relocate (net
        # new, added for consistency with egui's now-proven pattern). Checks
        # tauri.conf.json specifically, NOT Cargo.toml, since tauri.conf.json
        # is the field confirmed to actually drive the shipped
        # CFBundleShortVersionString -- checking the field the build
        # actually consumes is a strictly stronger defense than checking
        # Cargo.toml, which only matters as a fallback when tauri.conf.json
        # omits its own version (it does not, here).
        run: |
          CONF_VERSION=$(jq -r '.version' apps/seam-explorer-webview/tauri.conf.json)
          if [ "${{ steps.tag.outputs.version }}" != "$CONF_VERSION" ]; then
            echo "Resolved version (${{ steps.tag.outputs.version }}) does not match apps/seam-explorer-webview/tauri.conf.json version ($CONF_VERSION)" >&2
            exit 1
          fi

  build:
    needs: prepare
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/seam-explorer-webview/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        working-directory: apps/seam-explorer-webview
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/seam-explorer-webview
        run: node_modules/.bin/tauri build

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true

  # The release is out — only now does main move on, so the version that
  # just shipped is never also the version a dev build reports. Guarded to
  # be safe on reruns: if main has already moved past the just-released
  # version (e.g. this job already ran once), it no-ops instead of
  # double-bumping.
  bump:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump the minor version on main
        env:
          RELEASED: ${{ needs.prepare.outputs.version }}
        run: |
          current=$(./scripts/version.sh get apps/seam-explorer-webview)
          if [ "$current" != "$RELEASED" ]; then
            echo "main is at ${current}, not the released ${RELEASED} — leaving it alone"
            exit 0
          fi

          next=$(./scripts/version.sh next "$RELEASED")
          ./scripts/version.sh set "$next" apps/seam-explorer-webview
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/seam-explorer-webview/Cargo.toml Cargo.lock apps/seam-explorer-webview/tauri.conf.json apps/seam-explorer-webview/package.json
          git commit -m "chore(webview): bump version to ${next} after seam-explorer-webview-v${RELEASED}"
          git push
