name: Release

# Intentional release workflow: publishes a macOS installer only when a
# version tag is pushed — not on every push/PR. The build is unsigned
# (documented install friction for teammates). Narrowed to a single
# macOS-only build 2026-08-07 — other target platforms dropped from scope.
#
# Lives at this repo's own root. arch-visual is a standalone repo (remote
# esumerfd/arch-visual.git) — it is no longer nested inside the
# esumerfd/work monorepo, so no wk-arch-visual/ path prefix is needed
# anymore. The Tauri app lives at seam-explorer/ (renamed from
# apps/seam-explorer-webview/), and bundle output lands in the shared
# workspace target/ at repo root (seam-explorer is a member of the root
# Cargo.toml workspace, alongside seam-core and seam-explorer-egui).

on:
  push:
    tags:
      - "seam-explorer-v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: seam-explorer/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        working-directory: seam-explorer
        run: npm ci

      - name: Build Tauri app
        working-directory: seam-explorer
        run: node_modules/.bin/tauri build

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
