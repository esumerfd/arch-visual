[package]
name = "seam-explorer-egui"
version = "0.2.0"
edition = "2021"
description = "Explore architectural seams in a Graphify code graph - native egui build."

[lib]
name = "seam_explorer_egui"
path = "src/lib.rs"

[[bin]]
name = "seam-explorer-egui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
egui_graphs = "0.31"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
seam-core = { path = "../seam-core" }

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["snapshot", "wgpu"] }

[package.metadata.bundle]
name = "Seam Explorer (egui)"
identifier = "com.archvisual.seamexploreregui"
icon = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns"]
category = "public.app-category.developer-tools"
short_description = "Visualize architectural seams in a codebase graph."
